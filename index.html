<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#863bff" />
    <meta
      name="description"
      content="Discover, filter, and save job opportunities from Wuzzuf, LinkedIn, Glassdoor, and Indeed."
    />
    <link rel="apple-touch-icon" href="/pwa-180.png" />
    <title>Job Tracker</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jt-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
